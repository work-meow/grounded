# Вопросы, на которых меряется поиск и ответы.
#
# Набор описывает документы из evals/corpus — пять коротких файлов, которые
# можно загрузить в свежую установку и получить сопоставимые числа. Если
# документа в базе нет, вопрос будет пропущен, а не засчитан как провал, так что
# набор можно дополнять вопросами про свои документы, не ломая остальное.
#
#   ask     — что спрашиваем
#   finds   — какой документ обязан найтись; без него вопрос считается негативным
#   answers — что обязано прозвучать в ответе (подстроки, достаточно одной)
#   empty   — в базе этого нет: ответ не должен ссылаться ни на что

[[question]]
ask = "Какой срок уведомления о расторжении договора аренды?"
finds = "Договор аренды офиса.md"
answers = ["45"]

[[question]]
ask = "Сколько стоит аренда офиса в месяц?"
finds = "Договор аренды офиса.md"
answers = ["168"]

[[question]]
ask = "Кто платит за капитальный ремонт помещения?"
finds = "Договор аренды офиса.md"
answers = ["арендодател"]

[[question]]
ask = "Сколько суточные по России?"
finds = "Регламент командировок.md"
answers = ["700"]

[[question]]
ask = "Что возмещается за проживание в Москве?"
finds = "Регламент командировок.md"
answers = ["5 000", "5000"]

[[question]]
ask = "В какой срок сдаётся авансовый отчёт после командировки?"
finds = "Регламент командировок.md"
answers = ["трёх", "три", "3"]

[[question]]
ask = "Что нужно проверить перед выкладкой релиза?"
finds = "Памятка по релизам.md"
answers = ["миграц", "alembic", "тест"]

[[question]]
ask = "Какой длины должен быть пароль по политике безопасности?"
finds = "Политика безопасности.md"
answers = ["14"]

[[question]]
ask = "Сколько хранятся резервные копии?"
finds = "Политика безопасности.md"
answers = ["30"]

[[question]]
ask = "Что делает разработчик в первую неделю после выхода?"
finds = "Онбординг.md"
answers = ["good first issue", "задач"]

