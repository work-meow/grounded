# Trimmed to what this project uses. The generated template carries ~120 lines
# of commented-out alternatives (other path separators, timezone handling,
# post-write hooks, several logging recipes); none of them applied here, and
# scrolling past them to find the four settings that do is not free.
#
# The database URL is deliberately absent: migrations/env.py reads it from the
# same Settings the application does, so there is one place to set it.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
