[project]
name = "rag-indexer"
version = "0.1.0"
description = "Pathway live index: S3 -> parse -> chunk -> embed -> hybrid retrieval"
# `unstructured` does not support 3.14 yet.
requires-python = ">=3.13,<3.14"
dependencies = [
    # the S3 key layout, shared with the API (../shared)
    "rag-shared",
    # Plain `pathway`, not pathway[xpack-llm]. The extra exists to satisfy the
    # optional_imports guards in pw.xpacks.llm, but the only ones we hit are
    # OpenAIEmbedder, UnstructuredParser, TokenCountSplitter, DocumentStore and
    # DocumentStoreServer — openai, tiktoken and unstructured cover all of them.
    # The extra would additionally pull litellm, cohere, llama-index,
    # google-generativeai, instructor, fastmcp and langchain<0.4: ~300 MB of
    # surface area this process never imports.
    "pathway>=0.32",
    "openai~=1.60",
    "tiktoken>=0.5",
    # Parsing, one library per format (see rag_indexer/parsers.py). Together
    # ~14 MB, against ~300 MB plus NLTK corpora for `unstructured` — which also
    # could not read a PDF without pulling torch, and spent 7.6 s on a DOCX
    # that python-docx handles in 34 ms.
    #
    # ponytail: pypdfium2 extracts embedded text, so a scanned PDF yields
    # nothing. Ceiling: image-only documents. Upgrade path: detect empty output
    # and fall back to an OCR pass.
    "pypdfium2>=5",
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pydantic-settings>=2.11",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14", "fpdf2>=2.8"]  # fpdf2 builds PDFs for the parser tests

# A path dependency rather than a uv workspace: a workspace resolves to one
# lockfile and one virtualenv, and Pathway's ~1.5 GB dependency tree has no
# business inside the API image.
[tool.uv.sources]
rag-shared = { path = "../shared", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_indexer"]
