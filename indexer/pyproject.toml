[project]
name = "rag-indexer"
version = "0.1.0"
description = "Pathway live index: uploads and connected sources -> parse -> chunk -> embed -> hybrid retrieval"
# Pathway ships abi3 wheels, but 3.13 is the interpreter this dependency set is
# actually exercised on, here and in CI. Nothing in the tree needs 3.14.
requires-python = ">=3.13,<3.14"
dependencies = [
    # the S3 key layout, shared with the API (../shared)
    "rag-shared",
    # Plain `pathway`, not pathway[xpack-llm]. The extra exists to satisfy the
    # optional_imports guards in pw.xpacks.llm, and the only ones this pipeline
    # trips are OpenAIEmbedder, RecursiveSplitter, DocumentStore and
    # DocumentStoreServer — covered by the three packages below. The extra would
    # additionally pull litellm, cohere, llama-index, google-generativeai,
    # instructor, fastmcp and langchain<0.4: ~300 MB never imported here, and a
    # langchain pin that contradicts the one the agent needs.
    "pathway>=0.32",
    "openai~=1.60",
    "tiktoken>=0.5",
    # RecursiveSplitter imports it lazily; without it the splitter raises at
    # graph-build time rather than at import, which is a much worse place.
    "langchain-text-splitters>=0.3",
    # Parsing, one library per format (see rag_indexer/parsers.py). Together
    # ~14 MB, against ~300 MB plus NLTK corpora for `unstructured` — which also
    # could not read a PDF without pulling torch, and spent 7.6 s on a DOCX
    # that python-docx handles in 34 ms.
    #
    # ponytail: pypdfium2 extracts embedded text, so a scanned PDF yields
    # nothing. Ceiling: image-only documents are indexed as empty. The API now
    # says so on upload (app/pdf.py), which is where the bytes and the document
    # id are in the same place; this parser still cannot, because it is handed
    # the bytes alone. Upgrade path: an OCR pass behind the same check.
    "pypdfium2>=5",
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pydantic-settings>=2.11",
    # Connected sources (rag_indexer/connectors/). Google's client is what
    # pw.io.gdrive imports; httpx and botocore are already in the tree via
    # openai and pathway, and are named here because this code calls them
    # directly rather than through the packages that brought them.
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "httpx>=0.28",
    "botocore>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14", "fpdf2>=2.8"]  # fpdf2 builds PDFs for the parser tests

# A path dependency rather than a uv workspace: a workspace resolves to one
# lockfile and one virtualenv, and Pathway's ~1.5 GB dependency tree has no
# business inside the API image.
[tool.uv.sources]
rag-shared = { path = "../shared", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
# RUF001-003: the product speaks Russian, so Cyrillic in strings, comments and
# docstrings is intentional rather than a homoglyph typo. Same reasoning, and
# the same line, as backend/pyproject.toml.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_indexer"]
