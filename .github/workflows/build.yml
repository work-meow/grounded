# Images are built here, never on the server.
#
# The deployment host is a 2 vCPU / 4 GB box that also runs other production
# services. Building three images on it once consumed ~29 GB of BuildKit cache
# and took the machine down. GitHub's runners build; the server only pulls.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Gates the build: an image that fails its own tests should never reach the
  # registry, let alone the server.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, indexer]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - run: uv sync --frozen
        working-directory: ${{ matrix.project }}
      - run: uv run ruff check .
        working-directory: ${{ matrix.project }}
      - run: uv run ruff format --check .
        working-directory: ${{ matrix.project }}
      - run: uv run pytest -q
        working-directory: ${{ matrix.project }}
        env:
          # Settings are required fields; the tests never make a real call.
          JWT_SECRET: test-secret-that-is-at-least-32-characters
          OPENROUTER_API_KEY: test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npx eslint .
        working-directory: frontend

  build:
    needs: [test, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, indexer, frontend]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          # Root context: both Python services depend on ../shared.
          context: .
          file: ${{ matrix.service }}/Dockerfile
          # The server is x86_64; a second platform would only double the wait.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
