# Вопросы, на которых меряется поиск и ответы.
#
# Набор описывает документы этой конкретной установки: если корпус изменился,
# вопрос про пропавший документ будет пропущен, а не засчитан как провал.
#
#   ask     — что спрашиваем
#   finds   — какой документ обязан найтись; без него вопрос считается негативным
#   answers — что обязано прозвучать в ответе (подстроки, регистр не важен)
#   empty   — в базе этого нет: ответ не должен ссылаться ни на что

[[question]]
ask = "Что у меня в вишлисте?"
finds = "Wishlist.md"
answers = ["айфон"]

[[question]]
ask = "Что нужно сделать с ноутбуком?"
finds = "Wishlist.md"
answers = ["кулер"]

[[question]]
ask = "Какую карту я хотел сделать?"
finds = "Wishlist.md"
answers = ["сбер"]

[[question]]
ask = "Как настроить разрешение GRUB?"
finds = "Памятка по линуксу.md"
answers = ["grub"]

[[question]]
ask = "Каким пакетом удаляются эмодзи в plasma?"
finds = "Памятка по линуксу.md"
answers = ["plasma6"]

[[question]]
ask = "Какой стек предлагается для сервиса про импульсивные покупки?"
finds = "Импульсивные покупки"
answers = ["fastapi"]

[[question]]
ask = "Что такое «Часы Жизни» в идее сервиса?"
finds = "Импульсивные покупки"
# Достаточно любого: одна подстрока на порождённый текст — проверка, которая
# падает от разброса модели, а не от ухудшения системы.
answers = ["врем", "час"]

[[question]]
ask = "Что у меня стоит забрать в Epic Games?"
finds = "4. Четверг.md"
answers = ["игр"]

[[question]]
ask = "Что уже установлено из языков в заметке про приложения?"
finds = "Приложения.md"
answers = ["python"]

[[question]]
ask = "Как в Notion отметить задачу выполненной?"
finds = "Check the box to mark items as done.md"
answers = ["галоч", "чекбокс", "box", "отмет"]

