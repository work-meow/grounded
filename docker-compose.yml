# Deployment for the Dokploy host.
#
# Images are pulled, never built here. This box has 2 vCPU and 3.8 GB of RAM and
# already carries other production services; building the three images on it
# exhausted memory and took the machine down — with it, everything else running
# on the host. (Disk was never the problem: the BuildKit cache measured 71 MB
# afterwards.) CI builds them (.github/workflows/build.yml); the server pulls.
#
# PostgreSQL is NOT here: the box already runs one (postgres1-hajnvy on
# dokploy-network) and a second instance would only compete for memory with it.
# DATABASE_URL points at the existing one.
#
# mem_limit on every service is a blast radius, not a target. The host carries
# other people's production, and a limit is what keeps one runaway container
# from taking the machine instead of just itself. Measured steady state, for
# reference when adjusting: indexer 400 MB, minio 350 MB, backend 120 MB,
# frontend 100 MB.
#
# Everything is reached through the existing Traefik on one hostname:
#   /api/*  -> backend      /*  -> frontend
# which makes the session cookie first-party and removes CORS entirely.
# The bucket gets its own hostname because presigned links are opened by the
# browser, not by us.

# Pathway logs its S3 poll roughly twice a second, so an unbounded json-file
# driver would quietly eat the disk. Capped for every service, not just that one.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  minio:
    <<: *logging
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      # Signed links must verify against the host the browser used.
      MINIO_SERVER_URL: ${S3_PUBLIC_URL}
    volumes:
      - minio-data:/data
    networks: [rag, dokploy-network]
    # MinIO grows its own caches; 350 MB against a 512 MB cap was closer than
    # anything should sit to being killed.
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.rag-s3-web.rule=Host(`${S3_DOMAIN}`)
      - traefik.http.routers.rag-s3-web.entrypoints=web
      - traefik.http.routers.rag-s3-web.middlewares=redirect-to-https@file
      - traefik.http.routers.rag-s3-web.service=rag-s3
      - traefik.http.routers.rag-s3.rule=Host(`${S3_DOMAIN}`)
      - traefik.http.routers.rag-s3.entrypoints=websecure
      - traefik.http.routers.rag-s3.tls.certresolver=letsencrypt
      - traefik.http.routers.rag-s3.service=rag-s3
      - traefik.http.services.rag-s3.loadbalancer.server.port=9000

  # One-shot: make the bucket, then exit.
  minio-init:
    <<: *logging
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    networks: [rag]
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 '${S3_ACCESS_KEY_ID}' '${S3_SECRET_ACCESS_KEY}' &&
             mc mb --ignore-existing local/${S3_BUCKET} &&
             echo 'bucket ready'"
    restart: "no"

  indexer:
    <<: *logging
    image: ${IMAGE_PREFIX:-ghcr.io/monitizationrsya/rag}-indexer:${IMAGE_TAG:-latest}
    pull_policy: always
    # Also how a new connected source takes effect: a Pathway graph is fixed
    # once built, so the indexer exits (75) when the manifest changes and comes
    # back with the new source wired in. Seconds, and no embedding re-paid.
    restart: unless-stopped
    depends_on:
      minio: {condition: service_healthy}
    environment:
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PATH_STYLE: "true"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      # Opens the credentials the API sealed into the connector manifest.
      SECRETS_KEY: ${SECRETS_KEY}
      GDRIVE_CREDENTIALS_JSON: ${GDRIVE_CREDENTIALS_JSON:-}
      REFRESH_INTERVAL_S: ${REFRESH_INTERVAL_S:-600}
      CACHE_DIR: /data/cache
      PORT: "8666"
    volumes:
      - indexer-cache:/data
    networks: [rag]
    healthcheck:
      # No curl in these images by design. A TCP connect is enough: the server
      # only binds once the graph is built and the embedder has answered.
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 8666), 3).close()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 90s
    # The Rust engine plus the in-memory vector and BM25 indexes live here, and
    # both grow with the corpus. An OOM kill costs a full re-index, so this is
    # the service that gets room.
    mem_limit: 2g

  backend:
    <<: *logging
    image: ${IMAGE_PREFIX:-ghcr.io/monitizationrsya/rag}-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      minio: {condition: service_healthy}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "true"
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PATH_STYLE: "true"
      PATHWAY_URL: http://indexer:8666
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL}
      SECRETS_KEY: ${SECRETS_KEY}
      GDRIVE_SERVICE_ACCOUNT_EMAIL: ${GDRIVE_SERVICE_ACCOUNT_EMAIL:-}
      CORS_ORIGINS: '["https://${APP_DOMAIN}"]'
    networks: [rag, dokploy-network]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    # An upload is buffered in memory before it reaches S3, so the ceiling has
    # to clear MAX_UPLOAD_BYTES (64 MB) with room for a second one alongside.
    mem_limit: 768m
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Higher priority than the catch-all frontend router below.
      - traefik.http.routers.rag-api-web.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.rag-api-web.entrypoints=web
      - traefik.http.routers.rag-api-web.priority=100
      - traefik.http.routers.rag-api-web.middlewares=redirect-to-https@file
      - traefik.http.routers.rag-api-web.service=rag-api
      - traefik.http.routers.rag-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.rag-api.entrypoints=websecure
      - traefik.http.routers.rag-api.priority=100
      - traefik.http.routers.rag-api.tls.certresolver=letsencrypt
      - traefik.http.routers.rag-api.service=rag-api
      - traefik.http.services.rag-api.loadbalancer.server.port=8000

  frontend:
    <<: *logging
    # NEXT_PUBLIC_API_URL is baked in at build time as "" — the UI calls /api on
    # its own origin. See .github/workflows/build.yml.
    image: ${IMAGE_PREFIX:-ghcr.io/monitizationrsya/rag}-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    networks: [rag, dokploy-network]
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 448m
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.rag-web-http.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.rag-web-http.entrypoints=web
      - traefik.http.routers.rag-web-http.priority=1
      - traefik.http.routers.rag-web-http.middlewares=redirect-to-https@file
      - traefik.http.routers.rag-web-http.service=rag-web
      - traefik.http.routers.rag-web.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.rag-web.entrypoints=websecure
      - traefik.http.routers.rag-web.priority=1
      - traefik.http.routers.rag-web.tls.certresolver=letsencrypt
      - traefik.http.routers.rag-web.service=rag-web
      - traefik.http.services.rag-web.loadbalancer.server.port=3000

volumes:
  minio-data:
  indexer-cache:

networks:
  rag:
  dokploy-network:
    external: true
