# Images are built here, never on the server.
#
# The deployment host is a 2 vCPU / 3.8 GB box that also runs other production
# services. Building three images on it exhausted memory and took the machine
# down, other people's services included. GitHub's runners build; the server
# only pulls.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Gates the build: an image that fails its own tests should never reach the
  # registry, let alone the server.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, indexer]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - run: uv sync --frozen
        working-directory: ${{ matrix.project }}
      - run: uv run ruff check .
        working-directory: ${{ matrix.project }}
      - run: uv run ruff format --check .
        working-directory: ${{ matrix.project }}
      # Required settings come from tests/conftest.py, so this is the same
      # command that works on a fresh checkout with no environment at all.
      - run: uv run pytest -q
        working-directory: ${{ matrix.project }}

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Next 16 generates the route-aware globals (LayoutProps, PageProps) into
      # .next/types. A fresh checkout has none, so tsc must not run before this.
      - run: npx next typegen
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npx eslint .
        working-directory: frontend

  build:
    needs: [test, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, indexer, frontend]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          # Root context: both Python services depend on ../shared.
          context: .
          file: ${{ matrix.service }}/Dockerfile
          # The server is x86_64; a second platform would only double the wait.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Unit tests pass on source, not on the image. A missing WORKDIR once shipped
  # a backend that crash-looped on `alembic upgrade head` because it started in
  # / instead of /app. This runs the images that were just pushed.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TAG: sha-${{ github.sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # The owner is mixed case and a Docker reference must be lowercase.
      # metadata-action does this for the build job; here it is manual.
      - name: resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Object storage, because connecting a source writes the manifest there
      # and the API refuses to pretend it succeeded if it cannot.
      - name: object storage
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=rag -e MINIO_ROOT_PASSWORD=ragragrag \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -fsS localhost:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 2
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            "mc alias set local http://localhost:9000 rag ragragrag && mc mb -p local/rag"

      - name: backend migrates and answers
        run: |
          # Throwaway, generated per run: a Fernet key is url-safe base64 of 32
          # bytes, which is exactly what this produces.
          docker run -d --name backend --network host \
            -e DATABASE_URL=postgresql+asyncpg://rag:rag@localhost:5432/rag \
            -e JWT_SECRET=smoke-test-secret-of-at-least-32-characters \
            -e OPENROUTER_API_KEY=smoke \
            -e SECRETS_KEY="$(openssl rand -base64 32 | tr '+/' '-_')" \
            -e COOKIE_SECURE=false \
            -e S3_ENDPOINT_URL=http://localhost:9000 \
            -e S3_ACCESS_KEY_ID=rag -e S3_SECRET_ACCESS_KEY=ragragrag \
            -e S3_PATH_STYLE=true \
            "$IMAGE-backend:$TAG"
          for _ in $(seq 1 30); do
            curl -fsS localhost:8000/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS localhost:8000/api/health
          # The tables must actually exist, not just the process be alive.
          docker exec backend python -c "
          import asyncio, sqlalchemy as sa
          from app.db import engine
          async def main():
              async with engine.connect() as c:
                  names = await c.run_sync(lambda s: sa.inspect(s).get_table_names())
              assert {'users','sources','documents','chats','messages'} <= set(names), names
              print('tables:', sorted(names))
          asyncio.run(main())
          "
          # And that they match the models. `alembic upgrade` proves the
          # migrations run; only this proves they describe what app/models.py
          # says — an index or constraint added to a model and forgotten in a
          # migration passes every other check in this file.
          docker exec backend alembic check

      # The queries themselves, against a real database. The unit tests cannot
      # reach this: they never open a connection, so a mistake in how a result
      # is consumed passes every one of them and 500s on the first request.
      - name: the API answers for a real user
        run: |
          TOKEN=$(docker exec backend rag-token --email smoke@test.local | tail -1)
          jar=$(mktemp)
          api() { curl -sS -b "$jar" -c "$jar" -o /tmp/body -w '%{http_code}' "$@"; }

          test "$(api -X POST localhost:8000/api/auth/login \
                    -H 'Content-Type: application/json' \
                    -d "{\"token\":\"$TOKEN\"}")" = 200

          echo "--- documents"
          test "$(api localhost:8000/api/sources)" = 200 && cat /tmp/body

          echo "--- connectors"
          test "$(api localhost:8000/api/connectors)" = 200 && cat /tmp/body

          echo "--- connect a source (writes the manifest)"
          test "$(api -X POST localhost:8000/api/connectors \
                    -H 'Content-Type: application/json' \
                    -d '{"kind":"notion","name":"smoke","config":{"token":"ntn_smoke"}}')" = 201
          id=$(python3 -c "import json;print(json.load(open('/tmp/body'))['id'])")

          echo "--- the manifest is there and carries no plaintext credential"
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            "mc alias set local http://localhost:9000 rag ragragrag >/dev/null &&
             mc cat local/rag/config/connectors.json" > /tmp/manifest
          cat /tmp/manifest
          if grep -q ntn_smoke /tmp/manifest; then
            echo "the credential reached the bucket in the clear"
            exit 1
          fi

          echo "--- a source nobody has indexed yet does not report as healthy"
          test "$(api localhost:8000/api/connectors)" = 200
          python3 -c "
          import json,sys
          source = json.load(open('/tmp/body'))['sources'][0]
          assert source['status'] == 'unknown', source
          print('status:', source['status'])
          "

          echo "--- both populations still list"
          test "$(api localhost:8000/api/sources)" = 200

          echo "--- disconnect"
          test "$(api -X DELETE "localhost:8000/api/connectors/$id")" = 204
          test "$(api -X DELETE "localhost:8000/api/connectors/$id")" = 404

      - name: indexer entrypoint imports
        run: docker run --rm "$IMAGE-indexer:$TAG" python -c "import rag_indexer.pipeline"

      - name: frontend serves the login page
        run: |
          docker run -d --name frontend -p 3000:3000 "$IMAGE-frontend:$TAG"
          for _ in $(seq 1 30); do
            curl -fsS localhost:3000/login >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS localhost:3000/login >/dev/null

      - name: logs on failure
        if: failure()
        run: |
          docker logs backend 2>&1 | tail -60
          docker logs frontend 2>&1 | tail -20
          docker logs minio 2>&1 | tail -20
