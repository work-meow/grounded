# Images are built here, never on the server.
#
# The deployment host is a 2 vCPU / 3.8 GB box that also runs other production
# services. Building three images on it exhausted memory and took the machine
# down, other people's services included. GitHub's runners build; the server
# only pulls.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Gates the build: an image that fails its own tests should never reach the
  # registry, let alone the server.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, indexer]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - run: uv sync --frozen
        working-directory: ${{ matrix.project }}
      - run: uv run ruff check .
        working-directory: ${{ matrix.project }}
      - run: uv run ruff format --check .
        working-directory: ${{ matrix.project }}
      # Required settings come from tests/conftest.py, so this is the same
      # command that works on a fresh checkout with no environment at all.
      - run: uv run pytest -q
        working-directory: ${{ matrix.project }}

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Next 16 generates the route-aware globals (LayoutProps, PageProps) into
      # .next/types. A fresh checkout has none, so tsc must not run before this.
      - run: npx next typegen
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npx eslint .
        working-directory: frontend

  build:
    needs: [test, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, indexer, frontend]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          # Root context: both Python services depend on ../shared.
          context: .
          file: ${{ matrix.service }}/Dockerfile
          # The server is x86_64; a second platform would only double the wait.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Unit tests pass on source, not on the image. A missing WORKDIR once shipped
  # a backend that crash-looped on `alembic upgrade head` because it started in
  # / instead of /app. This runs the images that were just pushed.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TAG: sha-${{ github.sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # The owner is mixed case and a Docker reference must be lowercase.
      # metadata-action does this for the build job; here it is manual.
      - name: resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Object storage, because connecting a source writes the manifest there
      # and the API refuses to pretend it succeeded if it cannot.
      - name: object storage
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=rag -e MINIO_ROOT_PASSWORD=ragragrag \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -fsS localhost:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 2
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            "mc alias set local http://localhost:9000 rag ragragrag && mc mb -p local/rag"

      - name: backend migrates and answers
        run: |
          # Throwaway, generated per run: a Fernet key is url-safe base64 of 32
          # bytes, which is exactly what this produces.
          docker run -d --name backend --network host \
            -e DATABASE_URL=postgresql+asyncpg://rag:rag@localhost:5432/rag \
            -e JWT_SECRET=smoke-test-secret-of-at-least-32-characters \
            -e OPENROUTER_API_KEY=smoke \
            -e SECRETS_KEY="$(openssl rand -base64 32 | tr '+/' '-_')" \
            -e COOKIE_SECURE=false \
            -e S3_ENDPOINT_URL=http://localhost:9000 \
            -e S3_ACCESS_KEY_ID=rag -e S3_SECRET_ACCESS_KEY=ragragrag \
            -e S3_PATH_STYLE=true \
            "$IMAGE-backend:$TAG"
          for _ in $(seq 1 30); do
            curl -fsS localhost:8000/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS localhost:8000/api/health
          # The tables must actually exist, not just the process be alive.
          docker exec backend python -c "
          import asyncio, sqlalchemy as sa
          from app.db import engine
          async def main():
              async with engine.connect() as c:
                  names = await c.run_sync(lambda s: sa.inspect(s).get_table_names())
              assert {'users','sources','documents','chats','messages'} <= set(names), names
              print('tables:', sorted(names))
          asyncio.run(main())
          "
          # And that they match the models. `alembic upgrade` proves the
          # migrations run; only this proves they describe what app/models.py
          # says — an index or constraint added to a model and forgotten in a
          # migration passes every other check in this file.
          docker exec backend alembic check

      # The queries themselves, against a real database. The unit tests cannot
      # reach this: they never open a connection, so a mistake in how a result
      # is consumed passes every one of them and 500s on the first request.
      - name: the API answers for a real user
        run: |
          TOKEN=$(docker exec backend rag-token --email smoke@test.local | tail -1)
          jar=$(mktemp)
          api() { curl -sS -b "$jar" -c "$jar" -o /tmp/body -w '%{http_code}' "$@"; }

          test "$(api -X POST localhost:8000/api/auth/login \
                    -H 'Content-Type: application/json' \
                    -d "{\"token\":\"$TOKEN\"}")" = 200

          echo "--- documents"
          test "$(api localhost:8000/api/sources)" = 200 && cat /tmp/body

          echo "--- connectors"
          test "$(api localhost:8000/api/connectors)" = 200 && cat /tmp/body

          echo "--- connect a source (writes the manifest)"
          test "$(api -X POST localhost:8000/api/connectors \
                    -H 'Content-Type: application/json' \
                    -d '{"kind":"notion","name":"smoke","config":{"token":"ntn_smoke"}}')" = 201
          id=$(python3 -c "import json;print(json.load(open('/tmp/body'))['id'])")

          echo "--- the manifest is there and carries no plaintext credential"
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            "mc alias set local http://localhost:9000 rag ragragrag >/dev/null &&
             mc cat local/rag/config/connectors.json" > /tmp/manifest
          cat /tmp/manifest
          if grep -q ntn_smoke /tmp/manifest; then
            echo "the credential reached the bucket in the clear"
            exit 1
          fi

          echo "--- a source nobody has indexed yet does not report as healthy"
          test "$(api localhost:8000/api/connectors)" = 200
          python3 -c "
          import json,sys
          source = json.load(open('/tmp/body'))['sources'][0]
          assert source['status'] == 'unknown', source
          print('status:', source['status'])
          "

          echo "--- an object store inside the network is refused"
          # The one connector whose address comes from a form, on a box whose
          # docker network carries the object store, the API and the database.
          for address in http://127.0.0.1:9000 http://169.254.169.254 http://minio:9000; do
            test "$(api -X POST localhost:8000/api/connectors \
                      -H 'Content-Type: application/json' \
                      -d "{\"kind\":\"s3\",\"name\":\"внутрь\",\"config\":{\"endpoint_url\":\"$address\",\"bucket\":\"rag\",\"access_key_id\":\"rag\",\"secret_access_key\":\"ragragrag\"}}")" = 422
            cat /tmp/body; echo
          done

          echo "--- and a public one is accepted, optional fields and all"
          test "$(api -X POST localhost:8000/api/connectors \
                    -H 'Content-Type: application/json' \
                    -d '{"kind":"s3","name":"облако","config":{"endpoint_url":"https://s3.us-west-004.backblazeb2.com","bucket":"documents","access_key_id":"k","secret_access_key":"s","prefix":"/договоры/"}}')" = 201
          bucket=$(python3 -c "import json;print(json.load(open('/tmp/body'))['id'])")
          test "$(api -X DELETE "localhost:8000/api/connectors/$bucket")" = 204

          echo "--- the same source cannot be connected twice"
          test "$(api -X POST localhost:8000/api/connectors \
                    -H 'Content-Type: application/json' \
                    -d '{"kind":"notion","name":"another name","config":{"token":"ntn_smoke"}}')" = 409
          cat /tmp/body

          echo "--- both populations still list"
          test "$(api localhost:8000/api/sources)" = 200

          echo "--- an uploaded scan is called a scan"
          # Authored with the pdfium already in the image: pages, no text — the
          # thing that used to upload, index to nothing and look perfectly fine.
          docker exec backend python -c "
          import pypdfium2 as pdfium
          scan = pdfium.PdfDocument.new()
          scan.new_page(200, 200)
          scan.save('/tmp/scan.pdf')
          "
          docker cp backend:/tmp/scan.pdf /tmp/scan.pdf
          test "$(api -X POST localhost:8000/api/sources -F file=@/tmp/scan.pdf)" = 201
          python3 -c "
          import json
          document = json.load(open('/tmp/body'))
          assert document['text_layer'] is False, document
          print('scan flagged:', document['filename'], document['text_layer'])
          "

          echo "--- and a format that has no such question gets no verdict"
          printf 'Заметка про отпуск.\n' > /tmp/note.md
          test "$(api -X POST localhost:8000/api/sources -F file=@/tmp/note.md)" = 201
          python3 -c "
          import json
          assert json.load(open('/tmp/body'))['text_layer'] is None
          "

          echo "--- search answers, and says the index is missing rather than 500ing"
          # No indexer in this job, which is the point: the endpoint has to
          # come back as a service that is unavailable, not as a broken request.
          test "$(api 'localhost:8000/api/search?q=%D1%82%D0%B5%D1%81%D1%82')" = 503
          cat /tmp/body
          test "$(api localhost:8000/api/search)" = 422

          echo "--- an answer can be marked good or bad, and only an answer"
          test "$(api -X POST localhost:8000/api/chats)" = 201
          rated=$(python3 -c "import json;print(json.load(open('/tmp/body'))['id'])")
          # A message id that is not in this chat: the point is that it is
          # refused rather than stored somewhere nobody will read it.
          test "$(api -X PUT "localhost:8000/api/chats/$rated/messages/00000000-0000-0000-0000-000000000000/rating" \
                    -H 'Content-Type: application/json' -d '{"rating":1}')" = 404
          # And a scale is not an opinion this records.
          test "$(api -X PUT "localhost:8000/api/chats/$rated/messages/00000000-0000-0000-0000-000000000000/rating" \
                    -H 'Content-Type: application/json' -d '{"rating":5}')" = 422
          test "$(api -X DELETE "localhost:8000/api/chats/$rated")" = 204

          echo "--- search narrows to one source"
          test "$(api 'localhost:8000/api/search?q=%D1%82%D0%B5%D1%81%D1%82&source=00000000-0000-0000-0000-000000000000')" = 503
          test "$(api 'localhost:8000/api/search?q=%D1%82%D0%B5%D1%81%D1%82&source=not-a-uuid')" = 422

          echo "--- a question declares whether it may use the web"
          # The body is validated before anything reaches a model, so this
          # costs nothing and still proves the field exists and is a boolean.
          test "$(api -X POST "localhost:8000/api/chats/00000000-0000-0000-0000-000000000000/messages" \
                    -H 'Content-Type: application/json' \
                    -d '{"question":"привет","web":"maybe"}')" = 422

          echo "--- a chat pages from its end"
          test "$(api -X POST localhost:8000/api/chats)" = 201
          chat=$(python3 -c "import json;print(json.load(open('/tmp/body'))['id'])")
          test "$(api "localhost:8000/api/chats/$chat/messages?limit=1")" = 200
          python3 -c "
          import json
          page = json.load(open('/tmp/body'))
          assert page == {'messages': [], 'next_cursor': None}, page
          print('empty page:', page)
          "
          # A cursor is a position, not free text: one that is not one is a bad
          # request rather than a 500 out of the query builder.
          test "$(api "localhost:8000/api/chats/$chat/messages?before=nonsense")" = 422
          test "$(api -X DELETE "localhost:8000/api/chats/$chat")" = 204

          echo "--- disconnect"
          test "$(api -X DELETE "localhost:8000/api/connectors/$id")" = 204
          test "$(api -X DELETE "localhost:8000/api/connectors/$id")" = 404

      - name: indexer entrypoint imports
        run: docker run --rm "$IMAGE-indexer:$TAG" python -c "import rag_indexer.pipeline"

      - name: frontend serves the login page
        run: |
          docker run -d --name frontend -p 3000:3000 "$IMAGE-frontend:$TAG"
          for _ in $(seq 1 30); do
            curl -fsS localhost:3000/login >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS localhost:3000/login >/dev/null

      - name: logs on failure
        if: failure()
        run: |
          docker logs backend 2>&1 | tail -60
          docker logs frontend 2>&1 | tail -20
          docker logs minio 2>&1 | tail -20
